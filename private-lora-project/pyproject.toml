[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "private-lora-training"
version = "0.1.0"
description = "DP-LoRA fine-tuning with ghost clipping"
requires-python = ">=3.10"
dependencies = [
  "bitsandbytes>=0.45",
  "datasets>=2.18",
  "opacus>=1.4",
  "peft>=0.15",
  "PyYAML>=6.0",
  "torch>=2.2",
  "transformers>=4.51",
]

[project.scripts]
private-lora-train = "private_lora.finetune:main"
private-lora-load-model = "private_lora.load_model:main"
private-lora-prepare-data = "private_lora.prepare_data:main"
private-lora-evaluate = "private_lora.evaluate:main"
download-enron = "private_lora.download_enron:main"

[tool.setuptools.packages.find]
where = ["src"]
